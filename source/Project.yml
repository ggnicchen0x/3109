name: "5013"
options:
  bundleIdPrefix: com.5013
  deploymentTarget:
    iOS: "15.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
  defaultConfig: Release

settings:
  base:
    TARGETED_DEVICE_FAMILY: "1,2"
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    ARCHS: arm64
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGN_IDENTITY: ""

targets:
  "5013":
    type: application
    platform: iOS
    sources:
      - path: app
        excludes:
          - "*.h"
      - path: services
      - path: views
      - path: exploit
        excludes:
          - "*.h"
      - path: sandbox
      - path: mcm
        excludes:
          - "*.h"
      - path: worse_query
        excludes:
          - "*.h"
    settings:
      base:
        INFOPLIST_FILE: Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.5013.app
        PRODUCT_NAME: "5013"
        SWIFT_OBJC_BRIDGING_HEADER: 5013-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)"
          - "$(SRCROOT)/exploit"
          - "$(SRCROOT)/sandbox"
          - "$(SRCROOT)/mcm"
          - "$(SRCROOT)/worse_query"
          - "$(SRCROOT)/app"
          - "$(SRCROOT)/stubs"
        OTHER_LDFLAGS:
          - "-lsqlite3"
          - "-framework IOKit"
          - "-framework IOSurface"
        CLANG_ENABLE_MODULES: "YES"
        GCC_PRECOMPILE_PREFIX_HEADER: "NO"
      configs:
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: ""
          SWIFT_OPTIMIZATION_LEVEL: "-O"
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG"
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    info:
      path: Info.plist
